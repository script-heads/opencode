apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-ingress
  namespace: timenote
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - code.gptunnel.ru
      secretName: code-gptunnel-tls
  rules:
    - host: code.gptunnel.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tunnelcode
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tunnelcode-ingress
  namespace: timenote
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - gptunnel.ru
      secretName: gptunnel-tls
  rules:
    - host: gptunnel.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tunnelcode
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tunnelcode
  namespace: timenote
spec:
  ports:
    - name: tunnelcode
      port: 80
      targetPort: 80
  selector:
    app: tunnelcode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnelcode
  namespace: timenote
  labels:
    app: tunnelcode
spec:
  selector:
    matchLabels:
      app: tunnelcode
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: tunnelcode
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: yandex.cloud/node-group-id
                    operator: In
                    values:
                      - catc7e6q6v4kviesf5cg
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tunnelcode
                topologyKey: kubernetes.io/hostname
      containers:
        - name: tunnelcode
          resources:
            limits:
              cpu: "100m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"
          image: cr.yandex/crptshuuct3ne1mn7rg1/tunnelcode:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /releases/latest.txt
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 3
            failureThreshold: 5
            successThreshold: 1
          imagePullPolicy: Always
